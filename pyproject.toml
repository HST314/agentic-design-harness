[project]
name = "agentic-design-harness"
version = "0.2.0"
description = "Single-machine control plane for isolated design Agent processes"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "Pillow==12.3.0",
  "pydantic==2.10.4",
  "PyYAML==6.0.2",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "ruff==0.8.6",
]

[project.scripts]
design-harness = "harness.__main__:main"

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pyright]
pythonVersion = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
