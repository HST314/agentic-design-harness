<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通用 Agent</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(180deg, #f8faff 0, #f3f5fa 100%); }
    header { padding: 18px 24px; border-bottom: 1px solid #dfe5ef; background: rgba(255,255,255,.9); }
    header div { display: flex; align-items: center; gap: 10px; }
    .badge { padding: 4px 9px; border-radius: 999px; background: #ede9fe; color: #6d28d9; font-size: 12px; font-weight: 700; }
    h1 { margin: 0; font-size: 17px; }
    header p { margin: 5px 0 0; color: #667085; font-size: 13px; }
    #messages { overflow-y: auto; padding: 24px max(24px, calc((100% - 820px)/2)); display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: min(78%, 680px); padding: 12px 14px; border: 1px solid #dfe5ef; border-radius: 14px; background: #fff; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 2px 8px rgba(34,48,74,.04); }
    .message--user { align-self: flex-end; border-color: #d8ccfb; background: #f3efff; }
    .message--assistant { align-self: flex-start; }
    .message--error { border-color: #fecaca; background: #fff1f2; }
    .message small { display: block; margin-bottom: 5px; color: #667085; font-size: 11px; font-weight: 700; }
    form { padding: 16px max(24px, calc((100% - 820px)/2)) 20px; border-top: 1px solid #dfe5ef; background: rgba(255,255,255,.95); }
    .composer { display: flex; align-items: flex-end; gap: 10px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 14px; background: #fff; box-shadow: 0 6px 22px rgba(34,48,74,.08); }
    textarea { min-height: 44px; max-height: 160px; flex: 1; resize: vertical; border: 0; padding: 10px; font: inherit; line-height: 1.45; }
    textarea:focus { outline: none; }
    .composer:focus-within { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.14); }
    button { min-height: 42px; padding: 0 18px; border: 0; border-radius: 10px; color: #fff; background: #6d28d9; font-weight: 700; cursor: pointer; transition: background .15s ease; }
    button:hover { background: #5b21b6; }
    button:focus-visible { outline: 3px solid rgba(124,58,237,.28); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 20px; margin: 7px 4px 0; color: #667085; font-size: 12px; }
    #status.error { color: #b42318; }
    @media (max-width: 640px) { header { padding: 14px 16px; } #messages, form { padding-left: 14px; padding-right: 14px; } .message { max-width: 90%; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><span class="badge">通用</span><h1>任务对话</h1></div><p>可读取与写入当前任务共享文件夹</p></header>
    <section id="messages" aria-label="通用 Agent 对话" aria-live="polite"></section>
    <form id="form">
      <div class="composer"><textarea id="input" rows="1" maxlength="20000" placeholder="继续补充任务要求…" aria-label="发送给通用 Agent 的消息" required></textarea><button id="send" type="submit">发送</button></div>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    function render(items) {
      messages.replaceChildren(...items.map(item => {
        const node = document.createElement('article');
        node.className = `message message--${item.role}${item.status === 'error' ? ' message--error' : ''}`;
        const label = document.createElement('small');
        label.textContent = item.role === 'user' ? '任务指令' : '通用 Agent';
        const text = document.createElement('div');
        text.textContent = item.content;
        node.append(label, text);
        return node;
      }));
      messages.scrollTop = messages.scrollHeight;
    }
    async function load() {
      const response = await fetch('/api/messages', {cache: 'no-store'});
      if (!response.ok) throw new Error('无法读取对话');
      render((await response.json()).messages);
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      send.disabled = true; input.disabled = true; status.className = ''; status.textContent = '通用 Agent 正在执行任务…';
      try {
        const response = await fetch('/api/messages', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({content})});
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '本轮执行失败');
        input.value = ''; render(payload.messages); status.textContent = '';
      } catch (error) {
        status.className = 'error'; status.setAttribute('role', 'alert'); status.textContent = error instanceof Error ? error.message : '本轮执行失败';
      } finally { send.disabled = false; input.disabled = false; input.focus(); }
    });
    load().catch(error => { status.className = 'error'; status.setAttribute('role', 'alert'); status.textContent = error.message; });
  </script>
</body>
</html>
