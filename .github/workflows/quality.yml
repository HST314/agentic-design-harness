name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend_matrix:
    name: backend (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check backend/harness scripts tests/unit tests/contract tests/integration tests/crash tests/e2e
      - run: python -m pyright backend/harness
      - run: python -m compileall -q backend/harness scripts tests
      - run: python scripts/secret_scan.py .
      - run: python scripts/check_agent_import_boundary.py backend/harness
      - run: python scripts/generate_frontend_contracts.py --check
      - run: python scripts/benchmark_storage_recovery.py --profile ci
      - run: python -m pip_audit -r requirements-runtime.txt --require-hashes --disable-pip --progress-spinner off

  backend:
    name: backend
    needs: backend_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python version to pass
        env:
          BACKEND_MATRIX_RESULT: ${{ needs.backend_matrix.result }}
        run: test "$BACKEND_MATRIX_RESULT" = success

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  workbench-real-image:
    name: workbench real Image closure
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HST314/image_agent_mvp
          ref: 0e559d0153f479c8abefb14613804b8cde486282
          path: .runtime/image-agent-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run production workbench against pinned Image runtime
        run: make frontend-integration IMAGE_AGENT_ROOT=.runtime/image-agent-source

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/sbom/*.cdx.json

  release-gate:
    name: release gate
    if: ${{ always() }}
    needs: [backend, frontend, workbench-real-image, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          REAL_IMAGE_RESULT: ${{ needs.workbench-real-image.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$REAL_IMAGE_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
