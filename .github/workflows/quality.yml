name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.components.outputs.backend }}
      frontend: ${{ steps.components.outputs.frontend }}
      windows: ${{ steps.components.outputs.windows }}
      documentation: ${{ steps.components.outputs.documentation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: components
        name: Select required jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          python3 scripts/ci_changed_components.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build the locked Image runtime dependencies used by integration tests
        run: >-
          python -m pip install --disable-pip-version-check --upgrade
          --target .runtime/image-agent-deps
          -r agents/image_agent_mvp/requirements.lock
          -r requirements/image-agent-web.in
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run backend core tests
        run: python -m unittest discover -s tests -v
      - name: Run static, contract and security checks once
        run: |
          python -m ruff check backend/harness scripts tests/unit tests/contract tests/integration tests/crash tests/e2e
          python -m pyright backend/harness
          python -m compileall -q backend/harness scripts tests
          python scripts/secret_scan.py .
          python scripts/check_agent_import_boundary.py backend/harness
          python scripts/verify_image_agent_lock.py
          python scripts/generate_frontend_contracts.py --check

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  windows_runtime:
    name: Windows runtime focus
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: "backend;tests"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run Windows startup, settings and process tests
        run: >-
          python -m unittest -v
          tests.unit.test_windows_runtime
          tests.unit.test_dev_launcher
          tests.integration.test_image_agent_config
          tests.integration.test_runtime_settings_control_plane
          tests.integration.test_supervisor.ProcessSupervisorTests.test_three_isolated_processes_crash_cancel_and_archive_independently
          tests.integration.test_supervisor.ProcessSupervisorTests.test_three_instances_start_concurrently_without_revision_conflicts
          tests.integration.test_supervisor.ProcessSupervisorTests.test_reconcile_promotes_a_ready_start_interrupted_by_harness_crash
          tests.integration.test_supervisor.ProcessSupervisorTests.test_health_timeout_fails_start_and_releases_port
          tests.integration.test_supervisor.ProcessSupervisorTests.test_startup_verified_artifact_skips_per_instance_tree_scans
          tests.integration.test_supervisor.ProcessSupervisorTests.test_port_conflict_and_stale_pid_do_not_target_unrelated_process
      - name: Collect failure diagnostics
        if: failure()
        shell: pwsh
        run: ./scripts/collect_windows_ci_diagnostics.ps1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-runtime-diagnostics
          path: build/windows-ci/diagnostics.json
          if-no-files-found: error
          retention-days: 7

  documentation:
    name: documentation
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check document set, links, JSON, commands and versions
        run: python scripts/check_docs.py --report build/documentation-check.json
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-evidence
          path: build/documentation-check.json
          retention-days: 7

  quality_gate:
    name: release gate
    if: ${{ always() }}
    needs: [changes, backend, frontend, windows_runtime, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WINDOWS_RESULT: ${{ needs.windows_runtime.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$WINDOWS_RESULT" \
            "$DOCUMENTATION_RESULT"
          do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              exit 1
            fi
          done
