name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=backend python -m unittest discover -s tests -v
      - run: python -m ruff check backend/harness scripts tests/unit tests/contract tests/integration tests/crash
      - run: python -m compileall -q backend/harness scripts tests
      - run: python scripts/secret_scan.py .
      - run: python scripts/check_agent_import_boundary.py backend/harness

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
